name: Build tagmaker exe

on:
  push:
    paths:
      - 'tagmaker/mango_tag.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --name mango_tagmaker tagmaker/mango_tag.py
      - uses: actions/upload-artifact@v4
        with:
          name: mango_tagmaker
          path: dist/mango_tagmaker.exe
